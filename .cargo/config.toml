[alias]
# Run using: 'cargo test-serde'
#test-none = [ "test", "--no-default-features"]
test-serde = "test --features serde, vqm"
test-storage = "test --features storage, vqm"
test-vqm = "test --features vqm"
test-all = [ "test", "--features", "vqm, serde ,storage"]

check-none = [ "check", "--no-default-features"]
check-serde = [ "check", "--no-default-features", "--features", "serde"]
check-storage = [ "check", "--no-default-features", "--features", "storage"]
check-vqm = [ "check", "--no-default-features", "--features", "vqm"]
check-all = [ "check", "--features", "vqm, serde, storage"]

tp = "tarpaulin --ignore-tests --run-types Tests"
dc = ["tarpaulin", "--doc", "--ignore-tests", "--run-types", "Doctests", "--features", "vqm"]

# Run using: 'cargo + nightly doc-coverage'
doc-coverage = "rustdoc -- -Z unstable-options --show-coverage"

# Continuous Integration
ci = "run --package xtask --bin xtask"
# MSRV
check-msrv = "run --package xtask --bin xtask -- check-msrv"
